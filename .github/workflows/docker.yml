  name: Build ECR GHActions

  on:
    push:
      branches:
        - main

  jobs:
    test:
      name: Unit tests
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Run maven unit tests
          run: mvn test

    terraform:
      name: Terraform apply
      needs: [push_to_registry]
      runs-on: ubuntu-latest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: eu-west-1  
        steps:
          - name: checkout the repo
            uses: actions/checkout@v4

          - name: setup for terraform
            uses: hashicorp/setup-terraform@v3

          - name: terraform fmt
            working-directory: infra
            uses: terraform fmt -Check

          - name: terraform init
            working-directory: infra
            uses: terraform init

          - name: terraform apply
            working-directory: infra
            run: |
              rev=$(git rev-parse --short HEAD)
              terraform apply -auto-approve -var"candidate=2" -var="image_tag=$rev"



    push_to_registry:
      name: Push Docker image to ECR
      needs: [test]
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v4

        - name: Build and push Docker image
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: eu-west-1
          run: |
            aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 244530008913.dkr.ecr.eu-west-1.amazonaws.com
            rev=$(git rev-parse --short HEAD)
            docker build . -t wishifai
            docker tag wishifai 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-2:$rev
            docker tag wishifai 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-2:latest
            docker push 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-2:$rev
            docker push 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-2:latest
